# Непрерывная интеграция: сборка и тесты при каждом push и pull request,
# матрица Linux + Windows, артефакты сборки сохраняются.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Сервер (Python) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Стиль кода (ruff)
        run: ruff check app tests
      - name: Тесты
        run: pytest -q
      - name: Артефакт — исходный код сервера
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            backend/app
            backend/requirements.txt
            backend/Dockerfile

  frontend:
    name: Клиент (TypeScript) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Проверка типов
        run: npx tsc --noEmit
      - name: Сборка
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Артефакт — сборка клиента
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.os }}
          path: frontend/.next
          if-no-files-found: ignore

  docker:
    name: Docker-образы
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа сервера
        run: docker build -f backend/Dockerfile -t abp-backend:ci .
      - name: Сборка образа клиента
        run: docker build -t abp-frontend:ci ./frontend
      - name: Дымовая проверка сервера
        run: |
          docker run -d --name abp -p 8000:8000 -e SEARCH_BACKEND=memory -e SECRET_KEY=ci abp-backend:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf http://localhost:8000/api/health | grep '"status":"ok"'
          docker stop abp
